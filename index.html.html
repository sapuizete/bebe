<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nosso Amor</title>
  <style>
    body {
      background: #fff0f5;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 50px;
      color: #b03060;
    }
    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
    }
    #timer {
      font-size: 1.5em;
      margin-top: 10px;
      background: #ffe4e1;
      display: inline-block;
      padding: 15px 25px;
      border-radius: 12px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
    }
    .section {
      margin-top: 50px;
    }
    img {
      width: 250px;
      border-radius: 12px;
      margin: 10px;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #ff69b4;
      color: white;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #ff1493;
    }
    iframe {
      margin-top: 20px;
      border-radius: 12px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <h1>Estamos juntos há...</h1>
  <div id="timer">Calculando...</div>

  <div class="section">
    <h2>Nossas Memórias</h2>
    <img src="imagens/foto1.jpg" alt="Foto nossa" />
    <img src="imagens/foto2.jpg" alt="Mais uma" />
  </div>

  <div class="section">
    <h2>Nossa Música</h2>
    <iframe width="300" height="170" src="https://www.youtube.com/embed/YOUTUBE_ID" 
    title="YouTube video player" frameborder="0" allowfullscreen></iframe>
    <!-- Troque YOUTUBE_ID pelo ID do vídeo que você quiser -->
  </div>

  <div class="section">
    <h2>Cartinha de Amor</h2>
    <button onclick="mostrarMensagem()">Clique para ler</button>
    <p id="mensagem" style="margin-top: 20px; display: none; font-size: 1.2em;"></p>
  </div>

  <script>
    const startDate = new Date("2025-03-15T00:00:00");

    function updateTimer() {
      const now = new Date();
      let diff = Math.floor((now - startDate) / 1000);

      const years = Math.floor(diff / (365.25 * 24 * 60 * 60));
      diff %= (365.25 * 24 * 60 * 60);
      const months = Math.floor(diff / (30.44 * 24 * 60 * 60));
      diff %= (30.44 * 24 * 60 * 60);
      const days = Math.floor(diff / (24 * 60 * 60));
      diff %= (24 * 60 * 60);
      const hours = Math.floor(diff / 3600);
      diff %= 3600;
      const minutes = Math.floor(diff / 60);
      const seconds = diff % 60;

      document.getElementById("timer").textContent =
        `${years} ano(s), ${months} mês(es), ${days} dia(s), ` +
        ${hours}h ${minutes}min ${seconds}s;
    }

    function mostrarMensagem() {
      const msg = "Desde o dia 15 de março, minha vida ficou mais doce, mais leve e mais feliz. Eu te amo demais, e sou muito grata por cada momento ao seu lado.";
      const mensagem = document.getElementById("mensagem");
      mensagem.textContent = msg;
      mensagem.style.display = "block";
    }

    setInterval(updateTimer, 1000);
    updateTimer();
  </script>
</body>
</html>
